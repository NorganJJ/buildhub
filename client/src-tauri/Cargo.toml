[package]
name = "buildhub"
version = "0.5.0"
description = "BuildHub — app catalogue platform"
authors = ["NorganJJ"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buildhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }
