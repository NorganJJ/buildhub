name: Build desktop installers

# Собирает инсталляторы клиента (Tauri) под macOS (.dmg) и Windows (.msi/.exe)
# и выкладывает их как артефакты сборки (скачать можно со страницы запуска в Actions).
#
# ВАЖНО: адрес прод-API «запекается» в сборку через VITE_API_URL.
# Задайте его в Settings → Secrets and variables → Actions → Variables как
# репозиторную переменную VITE_API_URL (например https://buildhuber.ru).
#
# Запуск только вручную: собирать нужно ПОСЛЕ деплоя бэкенда и установки
# переменной VITE_API_URL, иначе в сборку попадёт неверный адрес API.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          # Прод-адрес API, попадает в сборку фронтенда (Vite).
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # macOS подпись + нотаризация — заработают, как только появятся секреты
          # APPLE_* (Developer ID). Пока их нет — сборка будет неподписанной.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: client
          args: ${{ matrix.args }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: buildhub-installers-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            client/src-tauri/target/**/release/bundle/dmg/*.dmg
            client/src-tauri/target/**/release/bundle/msi/*.msi
            client/src-tauri/target/**/release/bundle/nsis/*.exe
