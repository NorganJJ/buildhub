# BuildHub — example production nginx config.
# Terminates TLS, serves the built SPA, and reverse-proxies the API.
# Replace buildhub.example.com with your domain and adjust paths.

# Basic rate-limit zones (baseline, not a DDoS shield — use a WAF/CDN at the edge).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name buildhub.example.com;

    # ACME challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buildhub.example.com;

    # --- TLS ---
    ssl_certificate     /etc/letsencrypt/live/buildhub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buildhub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers ---
    # HSTS: start without preload; add `preload` only once you're confident.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP for the SPA. Tighten as needed; 'unsafe-inline' for styles covers Tailwind's
    # injected styles. Drop it if you move to nonce-based styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://buildhub.example.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 600M;   # must allow the largest upload (MAX_FILE_SIZE_MB)

    # --- Built SPA (client/dist) ---
    root /var/www/buildhub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API reverse proxy ---
    location /api/ {
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large file uploads/downloads can be slow; relax timeouts.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Stricter limit on auth endpoints (brute-force mitigation).
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
